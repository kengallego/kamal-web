      attachments_hint_postgresql_external: 各アプリは接続URLをプロジェクトの暗号化された環境変数として受け取ります。
      attachments_hint_redis: アプリごとに専用のデータベース番号を割り当てます。URLはプロジェクトの暗号化された環境変数として保存されます。
      attachments_hint_redis_external: 各アプリは接続URLをプロジェクトの暗号化された環境変数として受け取ります。
      check: 確認
      confirm_delete: '%{name}を削除しますか？'
      confirm_delete_data: '%{name}とボリューム%{volume}を削除しますか？データは復元できません。'
      confirm_detach_delete: データベース%{database}とそのユーザーを削除しますか？データは復元できません。
      confirm_detach_other: '%{project}の接続を解除しますか？変数%{variable}が削除されます。'
      confirm_detach_postgresql: '%{project}の接続を解除しますか？変数%{variable}が削除され、ユーザーはログインできなくなります。データは残ります。'
      container: コンテナ
      delete_created_hint: コンテナを停止して削除します。ボリューム%{volume}は残せるので、同じデータで新しいコンテナを起動できます。
      delete_data: データごと削除
      delete_in_use: このデータベースを削除する前に、すべてのアプリの接続を解除してください。
      delete_keep: 削除してボリュームは残す
      delete_registered_hint: Kamal Webが登録を削除するだけで、データベース自体は何も変わりません。
      detach: 接続解除
      detach_delete: 接続解除してデータを削除
      details: データベース
      firewall_hint: ポートは接続したアプリのサーバーからのみ受け付けます（DockerのDOCKER-USERチェーンのiptablesルール。再起動で消えるため5分ごとに再適用します）。
      firewall_existing_hint: このコンテナのファイアウォールはKamal Webが管理しません。アプリのサーバーだけがポートに届くようにしてください。
      host: ホスト
      image: イメージ
      last_check: 最終確認
      no_attachments: まだどのアプリも使っていません。
      no_projects: 接続するプロジェクトを追加してください。
      not_in_config_html: アプリのdeploy.ymlのenv.secretに%{variable}を、.kamal/secretsに%{line}を追加して、再デプロイしてください。
      not_published: 非公開
      other_servers: 他のサーバーから
      provisioning: コンテナを起動しています。初回はサーバーがイメージをダウンロードするため、1分ほどかかることがあります。
      remote: 別のサーバーから
      same_server: 同じサーバーから
      server: サーバー
      source: 種類
      variable: 変数
    sources:
      created: Kamal Webが作成
      existing: 既存のコンテナ
      external: 外部またはマネージド
