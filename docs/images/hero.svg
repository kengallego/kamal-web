<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
  <title id="title">Kamal Web — Kamal, with a view.</title>
  <desc id="desc">Editable background for the README cover. The exported cover includes a real dashboard screenshot in the lower frame.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#afcfaa" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1600" height="1030" rx="28" fill="#19231d"/>
  <rect width="1600" height="1030" rx="28" fill="url(#grid)"/>
  <circle cx="1450" cy="80" r="240" fill="none" stroke="#afcfaa" stroke-opacity=".12"/>
  <circle cx="1450" cy="80" r="182" fill="none" stroke="#afcfaa" stroke-opacity=".12"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(64 46)">
      <rect width="40" height="40" rx="12" fill="#afcfaa"/>
      <g transform="translate(8 8)" fill="none" stroke="#19231d" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
        <path d="m12 3 9 5-9 5-9-5 9-5Z M3 8v9l9 5 9-5V8 M12 13v9 M7.5 5.5l9 5"/>
      </g>
    </g>
    <text x="118" y="73" fill="#edf2e9" font-size="23" font-weight="700">Kamal Web</text>
    <text x="1536" y="72" text-anchor="end" fill="#afcfaa" font-size="14" letter-spacing="3">YOUR SERVERS. YOUR RULES.</text>
    <text x="64" y="176" fill="#edf2e9" font-size="82" font-weight="700" letter-spacing="-4">Kamal, with a view.</text>
    <text x="68" y="229" fill="#b7c7b7" font-size="25">Deploy, roll back and see how your apps are doing. All from your browser.</text>
    <g transform="translate(1338 117)" fill="none" stroke="#afcfaa" stroke-width="2.5" stroke-linejoin="round">
      <path d="m48 0 48 27-48 27L0 27 48 0Z M0 27v53l48 27 48-27V27 M48 54v53 M24 13.5l48 27"/>
    </g>
    <rect x="57" y="283" width="1486" height="652" rx="17" fill="#0e1711" stroke="#637a64" stroke-opacity=".5"/>
    <text x="66" y="987" fill="#afcfaa" font-size="15" letter-spacing="2">SELF-HOSTED</text>
    <circle cx="232" cy="982" r="2.5" fill="#6a826d"/>
    <text x="253" y="987" fill="#afcfaa" font-size="15" letter-spacing="2">ONE CONTAINER</text>
    <circle cx="456" cy="982" r="2.5" fill="#6a826d"/>
    <text x="477" y="987" fill="#afcfaa" font-size="15" letter-spacing="2">MIT LICENSE</text>
    <text x="1536" y="987" fill="#a6b9a7" font-size="15" text-anchor="end">Built for the apps you already deploy with Kamal.</text>
  </g>
</svg>
