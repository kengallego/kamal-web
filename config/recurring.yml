default: &default
  collect_server_metrics:
    class: CollectMetricsJob
    queue: monitoring
    schedule: every minute
  check_app_health:
    class: CheckAppHealthJob
    queue: monitoring
    schedule: every minute
  check_proxy_errors:
    class: CheckProxyErrorsJob
    queue: monitoring
    schedule: every 5 minutes
  roll_up_metrics:
    class: RollUpMetricsJob
    queue: monitoring
    schedule: every hour at minute 2
  prune_history:
    class: PruneHistoryJob
    queue: default
    schedule: every day at 4am
  scheduled_backup:
    class: ScheduledBackupJob
    queue: default
    schedule: every day at 3am
  discover_kamal_apps:
    class: DiscoverKamalAppsJob
    queue: default
    schedule: every 5 minutes
  check_for_updates:
    class: CheckForUpdatesJob
    queue: default
    schedule: every day at 6am

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
