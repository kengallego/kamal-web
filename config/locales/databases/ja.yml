# データベースと、それに接続したアプリ。
ja:
  activerecord:
    attributes:
      database:
        admin_user: スーパーユーザー
        container_name: コンテナ
        engine: エンジン
        image: バージョン
        name: 名前
        password: パスワード
        public_port: 他のサーバー用のポート
        server: サーバー
        server_id: サーバー
        url: 接続URL
      database_attachment:
        destination: デスティネーション
        variable: 変数
    errors:
      models:
        database:
          attributes:
            url:
              wrong_scheme: 'は次のいずれかで始めてください: %{schemes}'
        database_attachment:
          attributes:
            destination:
              unknown: はこのプロジェクトに設定されていません
            variable:
              invalid_name: は有効な環境変数名にしてください
