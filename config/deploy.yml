# Deploys Kamal Web with Kamal. Your settings go in .env (copy .env.example),
# not here. See README.md.
<%
  require "dotenv"
  Dotenv.load(".env")
  server = ENV["KAMAL_WEB_SERVER"].presence || raise("Set KAMAL_WEB_SERVER in .env (see .env.example)")
  ssh_user = ENV["KAMAL_WEB_SSH_USER"].presence || "root"
  # Without a domain of your own, sslip.io gives the server's IP a name that
  # Let's Encrypt can issue a certificate for.
  host = ENV["KAMAL_WEB_HOST"].presence || "kamal.#{server.tr(".", "-")}.sslip.io"
%>
service: kamal-web
image: kamal-web

servers:
  web:
    - <%= server %>

ssh:
  user: <%= ssh_user %>

proxy:
  ssl: true
  host: <%= host %>

# Kamal runs this registry on your machine and tunnels it to the server, so no
# registry account is needed.
registry:
  server: localhost:5555

builder:
  arch: amd64
  <%- if ENV["KAMAL_WEB_BUILD_ON_SERVER"] == "true" -%>
  remote: ssh://<%= ssh_user %>@<%= server %>
  <%- end -%>

env:
  secret:
    - KAMAL_WEB_PASSWORD
    - KAMAL_WEB_TOTP_SECRET
  clear:
    KAMAL_WEB_ALLOWED_IPS: "<%= ENV["KAMAL_WEB_ALLOWED_IPS"] %>"
    ASSUME_SSL: true
    FORCE_SSL: true
    KAMAL_WEB_URL: https://<%= host %>
    # For Update automatically, which deploys from the server with these settings.
    KAMAL_WEB_SSH_USER: <%= ssh_user %>
    # "strict" only connects to servers whose host key was trusted in Servers.
    KAMAL_WEB_SSH_HOST_KEYS: "<%= ENV["KAMAL_WEB_SSH_HOST_KEYS"] %>"

volumes:
  # Databases, the key that encrypts secrets, clones and the SSH key. Back it up.
  - kamal_web_storage:/rails/storage
  # Used to build images and to find the Kamal apps running on this server.
  - /var/run/docker.sock:/var/run/docker.sock

aliases:
  # Lets Kamal Web SSH into this server as Kamal's SSH user.
  authorize: server exec "docker exec $(docker ps -q -f label=service=kamal-web | head -1) bin/authorize-key | sh"
  logs: app logs -f
  # docker exec runs as root; gosu keeps files in the volume owned by the app user.
  console: app exec --interactive --reuse "gosu rails bin/rails console"
