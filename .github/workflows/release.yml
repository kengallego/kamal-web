name: Release

# Publishes each release's image, which instances with Update automatically on
# deploy (see app/services/self_update.rb). Make the package public once, in the
# repository's Packages settings, so they can pull it without a login.
on:
  release:
    types: [ published ]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check the version matches the tag
        run: |
          version=$(ruby -e 'load "config/initializers/version.rb"; print KamalWeb::VERSION')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "KamalWeb::VERSION is $version, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub's registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
