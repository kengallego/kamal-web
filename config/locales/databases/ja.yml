          not_reachable: アプリは別のサーバーで動いていますが、このデータベースは他のサーバーに公開されていません。先に他のサーバー用のポートを設定してください。
          not_running: データベースが動いていません。確認するか、起動するまで待ってください。
  common:
    databases: データベース
  databases:
    engines:
      postgresql: PostgreSQL
      redis: Redis / Valkey
    form:
      admin_user_hint: Kamal Webはコンテナのローカルソケット経由で、このユーザーとしてコンテナ内でpsqlを実行します。公式イメージではpostgresです。
      container_hint_html: <code>docker ps</code>に表示される名前です。dbという名前のKamal accessoryなら<code>myapp-db</code>のようになります。
      image_hint: ディスク上のデータがそのバージョンのものなので、メジャーバージョンは後から変更できません。
      keep_password: 空のままにすると現在のパスワードを使います
      keep_url: 空のままにすると現在のURLを使います
      name_hint: 小文字、数字、ハイフン。作成されるコンテナはkamal-web-db-NAMEという名前になります。
      no_servers_html: 先にサーバーを追加してください。%{link}
      public_port_hint_created: 使うアプリがすべて同じサーバーにあるなら空のままにします。ポートを指定すると、接続したアプリのサーバーだけがTLSで接続できます。
      public_port_hint_existing: 他のサーバーのアプリが使う場合、コンテナがすでに公開されているポートです。
      public_port_placeholder: 同じサーバーのみ
      redis_password_hint: このRedisサーバーのrequirepass（ある場合）。
      source_hints:
        created: Kamal Webがサーバー上のコンテナでデータベースを起動します。kamalネットワーク上で、データはDockerボリュームに置き、パスワードは自動生成します。
        existing: Kamal accessoryなど、すでにサーバーで動いているデータベースコンテナです。Kamal Webはその中にデータベースとユーザーを作ります。
        external: DigitalOceanなどのマネージドデータベースや、Kamal WebがURLで到達できるその他のサーバーです。アプリにはそのURLがそのまま渡されます。
      url_hint: 暗号化して保存します。接続したすべてのアプリがこのURLを受け取るので、アプリ用のユーザーとデータベースを使ってください。
    index:
      add: データベースを追加
      description: アプリが使うPostgreSQLとRedisのサーバー。自分のサーバー上でも、他所のマネージドでも。
      empty_description: サーバーにPostgreSQLやRedisを作成するか、動いているものを登録するか、マネージドデータベースをリンクします。その後アプリに接続します。
      empty_title: データベースはまだありません
      engine: エンジン
      name: 名前
      not_attached: 未接続
      where: 場所
    new:
      description: アプリはその後、データベースのページから接続します。
      engine: エンジン
      source: 種類
      title: データベースを追加
    show:
      app: アプリ
      attach: 接続
      attachments: 接続しているアプリ
